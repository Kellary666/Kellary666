name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate custom snake
        shell: bash
        run: |
          mkdir -p assets

          python3 <<'PY'
          from pathlib import Path

          width = 900
          height = 240

          cols = 26
          rows = 6

          start_x = 45
          start_y = 45
          dx = 32
          dy = 30

          duration = 18

          points = []

          for row in range(rows):
              if row % 2 == 0:
                  columns = range(cols)
              else:
                  columns = range(cols - 1, -1, -1)

              for col in columns:
                  x = start_x + col * dx
                  y = start_y + row * dy
                  points.append((x, y))

          total = len(points)

          path = "M " + " L ".join(
              f"{x} {y}"
              for x, y in points
          )

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          svg.append(
              '<rect x="10" y="10" width="880" height="220" '
              'rx="18" fill="#0d1117" '
              'stroke="#30363d" stroke-width="2"/>'
          )

          svg.append(
              '<defs>'
              '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">'
              '<feGaussianBlur stdDeviation="2.2" result="blur"/>'
              '<feMerge>'
              '<feMergeNode in="blur"/>'
              '<feMergeNode in="SourceGraphic"/>'
              '</feMerge>'
              '</filter>'
              '</defs>'
          )

          opacity_levels = [
              0.25,
              0.40,
              0.60,
              0.80,
              1.00
          ]

          svg.append('<g filter="url(#glow)">')

          for index, (x, y) in enumerate(points):

              opacity = opacity_levels[
                  index % len(opacity_levels)
              ]

              disappear_at = (
                  index / total
              )

              before = max(
                  0.0,
                  disappear_at - 0.008
              )

              svg.append(
                  f'<circle cx="{x}" cy="{y}" '
                  f'r="6.5" fill="#ff0000" '
                  f'opacity="{opacity}">'
                  f'<animate '
                  f'attributeName="opacity" '
                  f'values="{opacity};{opacity};0;0" '
                  f'keyTimes="0;{before:.4f};'
                  f'{disappear_at:.4f};1" '
                  f'dur="{duration}s" '
                  f'repeatCount="indefinite"/>'
                  f'</circle>'
              )

          svg.append('</g>')

          svg.append(
              f'<path id="snakePath" '
              f'd="{path}" '
              f'fill="none" stroke="none"/>'
          )

          snake = [
              (10.0, "#000000", 0.00),
              (9.5, "#020202", -0.12),
              (9.0, "#050505", -0.24),
              (8.5, "#080808", -0.36),
              (8.0, "#0b0b0b", -0.48),
              (7.5, "#101010", -0.60),
              (7.0, "#151515", -0.72),
              (6.5, "#1a1a1a", -0.84),
              (6.0, "#202020", -0.96),
              (5.5, "#262626", -1.08)
          ]

          for radius, color, begin in snake:

              svg.append(
                  f'<circle r="{radius}" '
                  f'fill="{color}">'
                  f'<animateMotion '
                  f'dur="{duration}s" '
                  f'begin="{begin}s" '
                  f'repeatCount="indefinite">'
                  f'<mpath href="#snakePath"/>'
                  f'</animateMotion>'
                  f'</circle>'
              )

          svg.append(
              '<rect x="10" y="10" '
              'width="880" height=220" '
              'rx="18" fill="none" '
              'stroke="#30363d" '
              'stroke-width="4"/>'
          )

          svg.append('</svg>')

          Path("assets/snake.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )
          PY

      - name: Commit generated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/snake.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update custom snake"
            git push
          fi"2
