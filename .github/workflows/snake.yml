name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate custom snake
        shell: bash
        run: |
          mkdir -p assets

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime

          # =========================
          # Canvas / grid settings
          # =========================
          cols = 53
          rows = 7
          cell = 11
          gap = 5
          margin_x = 18
          margin_y = 20

          width = margin_x * 2 + cols * cell + (cols - 1) * gap
          height = margin_y * 2 + rows * cell + (rows - 1) * gap

          duration = 18.0

          base_cell_color = "#2d333b"
          bright_food_color = "#39d353"
          dim_food_color = "#0e4429"

          # Snake colors: head -> tail
          snake_colors = [
              "#56d364",
              "#4cc75b",
              "#43bb53",
              "#39af4b",
              "#30a342",
              "#27973a",
              "#1f8b32",
              "#187f2b",
              "#127324",
              "#0d671e",
          ]

          snake_size = cell + 2

          def cell_xy(col, row):
              x = margin_x + col * (cell + gap)
              y = margin_y + row * (cell + gap)
              return x, y

          def center_xy(col, row):
              x, y = cell_xy(col, row)
              return x + cell / 2, y + cell / 2

          def build_route_from_waypoints(waypoints):
              route = [waypoints[0]]

              for (c1, r1), (c2, r2) in zip(waypoints, waypoints[1:]):
                  c, r = c1, r1

                  # horizontal part
                  while c != c2:
                      c += 1 if c2 > c else -1
                      route.append((c, r))

                  # vertical part
                  while r != r2:
                      r += 1 if r2 > r else -1
                      route.append((c, r))

              return route

          # =========================
          # Several route variants
          # Route changes depending on day
          # =========================
          route_variants = [
              [
                  (1, 5), (10, 5), (10, 2), (18, 2), (18, 6),
                  (29, 6), (29, 1), (38, 1), (38, 4), (47, 4), (51, 2)
              ],
              [
                  (2, 1), (13, 1), (13, 4), (6, 4), (6, 6),
                  (22, 6), (22, 2), (31, 2), (31, 5), (44, 5), (50, 3)
              ],
              [
                  (1, 3), (9, 3), (9, 0), (17, 0), (17, 5),
                  (27, 5), (27, 1), (35, 1), (35, 6), (46, 6), (51, 2)
              ],
          ]

          day_index = datetime.utcnow().timetuple().tm_yday % len(route_variants)
          route = build_route_from_waypoints(route_variants[day_index])

          # Remove accidental consecutive duplicates
          cleaned_route = [route[0]]
          for point in route[1:]:
              if point != cleaned_route[-1]:
                  cleaned_route.append(point)
          route = cleaned_route

          # Use first occurrence for route animation timing
          first_seen = {}
          for idx, point in enumerate(route):
              if point not in first_seen:
                  first_seen[point] = idx

          unique_route_points = list(first_seen.keys())
          total_steps = max(len(route) - 1, 1)

          # SVG path for snake movement
          path_points = []
          for col, row in route:
              cx, cy = center_xy(col, row)
              path_points.append((cx, cy))

          path_d = "M " + " L ".join(f"{x:.1f} {y:.1f}" for x, y in path_points)

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          # Transparent background (GitHub page background will show through)
          svg.append('<defs>')
          svg.append(
              '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">'
              '<feGaussianBlur stdDeviation="1.5" result="blur"/>'
              '<feMerge>'
              '<feMergeNode in="blur"/>'
              '<feMergeNode in="SourceGraphic"/>'
              '</feMerge>'
              '</filter>'
          )
          svg.append('</defs>')

          # =========================
          # Base grid
          # =========================
          svg.append('<g id="grid">')
          for row in range(rows):
              for col in range(cols):
                  x, y = cell_xy(col, row)
                  svg.append(
                      f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" '
                      f'rx="2" ry="2" fill="{base_cell_color}"/>'
                  )
          svg.append('</g>')

          # =========================
          # Food / route cells
          # Bright before snake arrives
          # Then become dim after collection
          # Next cycle return bright again
          # =========================
          svg.append('<g id="food" filter="url(#glow)">')
          for (col, row) in unique_route_points:
              x, y = cell_xy(col, row)
              idx = first_seen[(col, row)]

              progress = idx / total_steps
              just_before = max(0.0, progress - 0.008)

              svg.append(
                  f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" '
                  f'rx="2" ry="2" fill="{bright_food_color}">'
                  f'<animate attributeName="fill" '
                  f'values="{bright_food_color};{bright_food_color};{dim_food_color};{dim_food_color}" '
                  f'keyTimes="0;{just_before:.4f};{progress:.4f};1" '
                  f'dur="{duration}s" '
                  f'repeatCount="indefinite"/>'
                  f'</rect>'
              )
          svg.append('</g>')

          # =========================
          # Snake motion path
          # =========================
          svg.append(
              f'<path id="snakePath" d="{path_d}" fill="none" stroke="none"/>'
          )

          # =========================
          # Square snake
          # =========================
          segment_delay = 0.13
          for i, color in enumerate(snake_colors):
              begin = -(i * segment_delay)
              half = snake_size / 2
              svg.append(
                  f'<rect x="{-half:.1f}" y="{-half:.1f}" '
                  f'width="{snake_size}" height="{snake_size}" '
                  f'rx="2" ry="2" fill="{color}">'
                  f'<animateMotion dur="{duration}s" begin="{begin:.2f}s" repeatCount="indefinite">'
                  f'<mpath href="#snakePath"/>'
                  f'</animateMotion>'
                  f'</rect>'
              )

          svg.append('</svg>')

          Path("assets/snake.svg").write_text("\n".join(svg), encoding="utf-8")
          print("assets/snake.svg generated")
          PY

      - name: Commit snake to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/snake.svg

          if [ -n "$(git status --porcelain assets/snake.svg)" ]; then
            git commit -m "Update snake animation"
            git push origin main
          else
            echo "No changes to commit"
          fi
