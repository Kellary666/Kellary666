name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake
        shell: bash
        run: |
          mkdir -p assets

          python3 <<'PY'
          from pathlib import Path

          WIDTH = 900
          HEIGHT = 240

          COLS = 26
          ROWS = 6

          START_X = 45
          START_Y = 45

          DX = 32
          DY = 30

          DURATION = 18

          points = []

          for row in range(ROWS):
              columns = range(COLS) if row % 2 == 0 else range(COLS - 1, -1, -1)

              for col in columns:
                  x = START_X + col * DX
                  y = START_Y + row * DY
                  points.append((x, y))

          total = len(points)

          path = "M " + " L ".join(
              f"{x} {y}" for x, y in points
          )

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" height="{HEIGHT}" '
              f'viewBox="0 0 {WIDTH} {HEIGHT}">'
          )

          # Background
          svg.append(
              '<rect x="10" y="10" width="880" height="220" '
              'rx="18" fill="#0d1117" '
              'stroke="#30363d" stroke-width="2"/>'
          )

          # Red glow
          svg.append(
              '<defs>'
              '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">'
              '<feGaussianBlur stdDeviation="2" result="blur"/>'
              '<feMerge>'
              '<feMergeNode in="blur"/>'
              '<feMergeNode in="SourceGraphic"/>'
              '</feMerge>'
              '</filter>'
              '</defs>'
          )

          opacity_levels = [
              0.20,
              0.35,
              0.55,
              0.75,
              1.00
          ]

          svg.append('<g filter="url(#glow)">')

          # Red dots
          for index, (x, y) in enumerate(points):

              opacity = opacity_levels[index % len(opacity_levels)]

              progress = index / max(total - 1, 1)

              start_fade = max(
                  0,
                  progress - 0.008
              )

              svg.append(
                  f'<circle '
                  f'cx="{x}" '
                  f'cy="{y}" '
                  f'r="6.5" '
                  f'fill="#ff0000" '
                  f'opacity="{opacity}">'
                  
                  f'<animate '
                  f'attributeName="opacity" '
                  f'values="{opacity};{opacity};0;0" '
                  f'keyTimes="0;{start_fade:.4f};{progress:.4f};1" '
                  f'dur="{DURATION}s" '
                  f'repeatCount="indefinite"/>'
                  
                  f'</circle>'
              )

          svg.append('</g>')

          # Snake path
          svg.append(
              f'<path '
              f'id="snakePath" '
              f'd="{path}" '
              f'fill="none" '
              f'stroke="none"/>'
          )

          # Black snake body
          snake = [
              (11.0, "#000000", 0.00),
              (10.5, "#010101", -0.12),
              (10.0, "#030303", -0.24),
              (9.5, "#050505", -0.36),
              (9.0, "#080808", -0.48),
              (8.5, "#0b0b0b", -0.60),
              (8.0, "#101010", -0.72),
              (7.5, "#151515", -0.84),
              (7.0, "#1a1a1a", -0.96),
              (6.5, "#202020", -1.08),
              (6.0, "#262626", -1.20),
              (5.5, "#303030", -1.32)
          ]

          for radius, color, begin in snake:

              svg.append(
                  f'<circle '
                  f'r="{radius}" '
                  f'fill="{color}">'
                  
                  f'<animateMotion '
                  f'dur="{DURATION}s" '
                  f'begin="{begin}s" '
                  f'repeatCount="indefinite">'
                  
                  f'<mpath href="#snakePath"/>'
                  
                  f'</animateMotion>'
                  f'</circle>'
              )

          # Border on top
          svg.append(
              '<rect '
              'x="10" y="10" '
              'width="880" height="220" '
              'rx="18" '
              'fill="none" '
              'stroke="#30363d" '
              'stroke-width="4"/>'
          )

          svg.append('</svg>')

          Path("assets/snake.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print("Created assets/snake.svg")
          PY

          echo "Generated files:"
          ls -la assets

      - name: Commit snake to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/snake.svg

          git status

          git commit -m "Update snake animation" || echo "No changes to commit"

          git push origin main
